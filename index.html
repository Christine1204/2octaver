<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MIDI Trainer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="workspace">
      <!-- Left Control Drawer -->
      <aside id="sidebar">
        <header class="sidebar-header">
          <h2>MIDI Trainer</h2>
          <div id="device-info">No MIDI keyboard connected</div>
        </header>

        <section class="sidebar-group">
          <label class="btn file-btn">
            Load MIDI
            <input type="file" id="midi-upload" accept=".mid,.midi" />
          </label>

          <label class="btn file-btn audio-file-btn">
            Load Audio (MP3/WAV)
            <input type="file" id="audio-upload" accept="audio/*" />
          </label>
          <div id="audio-status" class="status-hint">No backing track loaded</div>
        </section>

        <!-- Audio Mixing & Calibration -->
        <section class="sidebar-group audio-controls-group">
          <div class="control-row">
            <label for="audio-volume">Audio Vol</label>
            <input type="range" id="audio-volume" min="0" max="1" step="0.05" value="0.8" />
          </div>
          <div class="control-row">
            <label for="sync-offset">Sync Delay: <span id="offset-label">0ms</span></label>
            <input type="range" id="sync-offset" min="-200" max="200" step="5" value="0" />
          </div>
        </section>

        <!-- Transport & Speed Controls -->
        <section class="sidebar-group transport-controls">
          <div class="btn-row">
            <button id="play-btn" disabled>Play (Space)</button>
            <button id="stop-btn" disabled>Stop</button>
            <button id="loop-btn" class="loop-toggle-btn" title="Toggle Loop Mode (L or Double-Click Marker)">
              <span class="loop-dot"></span>
              Loop
            </button>
          </div>

          <div class="speed-control-box">
            <div class="speed-header">
              <span>Playback Speed</span>
              <span id="speed-label">1.00×</span>
            </div>
            <input type="range" id="speed-slider" min="0.3" max="1.2" step="0.05" value="1.0" />
            <div class="speed-presets">
              <button type="button" class="preset-btn" data-speed="0.5">0.5×</button>
              <button type="button" class="preset-btn" data-speed="0.75">0.75×</button>
              <button type="button" class="preset-btn" data-speed="0.9">0.9×</button>
              <button type="button" class="preset-btn active" data-speed="1.0">1.0×</button>
            </div>
          </div>

          <div class="transpose-box">
            <div class="transpose-actions">
              <button id="oct-down-btn">-8va</button>
              <span id="transpose-label">+0 st</span>
              <button id="oct-up-btn">+8va</button>
            </div>
            <button id="auto-fit-btn" class="secondary-btn" disabled>Auto Fit</button>
          </div>

          <!-- Feature Toggles -->
          <label class="toggle-box">
            <input type="checkbox" id="fold-toggle" checked />
            <span>Fold all notes to 2 octaves</span>
          </label>

          <label class="toggle-box">
            <input type="checkbox" id="note-label-toggle" checked />
            <span>Show names on falling notes</span>
          </label>

          <label class="toggle-box">
            <input type="checkbox" id="key-label-toggle" checked />
            <span>Show names on piano keys</span>
          </label>
        </section>

        <!-- Songsterr-style Multi-Track List -->
        <section class="sidebar-group tracks-section">
          <h3>Tracks</h3>
          <div id="track-list" class="track-list">
            <p class="empty-hint">Load a MIDI file to select tracks.</p>
          </div>
        </section>
      </aside>

      <!-- Main Visual Viewport -->
      <main id="viewport">
        <!-- Integrated DAW Overview & Loop Track -->
        <div class="timeline-container" id="timeline-container">
          <canvas id="timeline-canvas"></canvas>

          <!-- Slideable Loop Marker A -->
          <div id="loop-marker-a" class="loop-slider-marker" title="Drag to adjust Start (Snaps to bars) • Double-click to toggle loop">
            <div class="loop-handle-tag">A</div>
            <div class="loop-handle-line"></div>
          </div>

          <!-- Slideable Loop Marker B -->
          <div id="loop-marker-b" class="loop-slider-marker" title="Drag to adjust End (Snaps to bars) • Double-click to toggle loop">
            <div class="loop-handle-tag">B</div>
            <div class="loop-handle-line"></div>
          </div>

          <!-- Playhead -->
          <div id="timeline-playhead"></div>
        </div>

        <!-- 4-Octave Falling Notes Stage -->
        <div class="canvas-stage">
          <canvas id="note-canvas"></canvas>
        </div>

        <div id="keyboard-view"></div>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
